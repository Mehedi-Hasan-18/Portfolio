    <script>
      window.addEventListener("portfolio:analytics-consent", (event) => {
        if (event.detail !== true || window.clarityStarted) return;
        window.clarityStarted = true;
        const loadClarity = () => {
          const clarity = document.createElement("script");
          clarity.async = true;
          clarity.src = "https://www.clarity.ms/tag/xy3t2io7zp";
          document.head.appendChild(clarity);
        };
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadClarity, { timeout: 3000 });
        } else {
          window.setTimeout(loadClarity, 1000);
        }
      });
    </script>
